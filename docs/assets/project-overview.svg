<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="overview-title overview-desc">
  <title id="overview-title">LLM Inference Lab — Serving, Benchmarking, Results</title>
  <desc id="overview-desc">Six repository components: runtime profiles configure a user-run endpoint, benchmark clients exchange calls and responses with it and write local reports, and reviewed Quick runs become normalized results and a static leaderboard. Sustained-load results follow a separate track. This is not a live deployment status.</desc>
  <metadata>Derived from the reviewed README Mermaid source. SHA-256: 68b2cbfbb1253b424a0f944278c6683136d267bc9f5ebdceef83009af735289c. Hash equality does not replace semantic review.</metadata>
