  <text class="section" x="93" y="167" data-max-width="295">Serving</text>
  <text class="section-note" x="48" y="197" data-max-width="340">런타임과 실행 환경</text>
  <text class="number amber" x="470" y="167" data-max-width="38">02</text>
  <text class="section" x="515" y="167" data-max-width="295">Benchmarking</text>
  <text class="section-note" x="470" y="197" data-max-width="340">기능 점검과 성능 측정</text>
