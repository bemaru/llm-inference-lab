      .body { font-size: 22px; fill: #354a65; }
      .detail { font-size: 20px; fill: #52647b; }
      .edge-label { font-size: 18px; fill: #52647b; }
      .footer { font-size: 20px; fill: #354a65; }
      .small { font-size: 18px; fill: #52647b; }
      .blue { fill: #3069ac; }
      .amber { fill: #94601c; }
      .green { fill: #21745c; }
      .flow { fill: none; stroke: #657a96; stroke-width: 2.3; marker-end: url(#arrow); }
      .review-flow { fill: none; stroke: #21745c; stroke-width: 2.3; marker-end: url(#review-arrow); }
    </style>
  </defs>
