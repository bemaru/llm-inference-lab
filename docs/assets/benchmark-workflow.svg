<svg id="benchmark-workflow" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="flowchart" style="max-width: 1244.57px; background-color: white;" viewBox="0 0 1244.5703125 74.5999984741211" role="graphics-document document" aria-roledescription="flowchart-v2" aria-describedby="chart-desc-benchmark-workflow" aria-labelledby="chart-title-benchmark-workflow"><title id="chart-title-benchmark-workflow">Inference benchmark evidence flow</title><desc id="chart-desc-benchmark-workflow">Benchmark clients call a user-provided endpoint and save local result JSON. Selected Quick runs are reviewed and normalized into public summaries, then rendered as a static leaderboard.</desc><style>#benchmark-workflow{font-family:Arial;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#benchmark-workflow .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#benchmark-workflow .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#benchmark-workflow .error-icon{fill:#552222;}#benchmark-workflow .error-text{fill:#552222;stroke:#552222;}#benchmark-workflow .edge-thickness-normal{stroke-width:1px;}#benchmark-workflow .edge-thickness-thick{stroke-width:3.5px;}#benchmark-workflow .edge-pattern-solid{stroke-dasharray:0;}#benchmark-workflow .edge-thickness-invisible{stroke-width:0;fill:none;}#benchmark-workflow .edge-pattern-dashed{stroke-dasharray:3;}#benchmark-workflow .edge-pattern-dotted{stroke-dasharray:2;}#benchmark-workflow .marker{fill:#333333;stroke:#333333;}#benchmark-workflow .marker.cross{stroke:#333333;}#benchmark-workflow svg{font-family:Arial;font-size:16px;}#benchmark-workflow p{margin:0;}#benchmark-workflow .label{font-family:Arial;color:#333;}#benchmark-workflow .cluster-label text{fill:#333;}#benchmark-workflow .cluster-label span{color:#333;}#benchmark-workflow .cluster-label span p{background-color:transparent;}#benchmark-workflow .label text,#benchmark-workflow span{fill:#333;color:#333;}#benchmark-workflow .node rect,#benchmark-workflow .node circle,#benchmark-workflow .node ellipse,#benchmark-workflow .node polygon,#benchmark-workflow .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#benchmark-workflow .rough-node .label text,#benchmark-workflow .node .label text,#benchmark-workflow .image-shape .label,#benchmark-workflow .icon-shape .label{text-anchor:middle;}#benchmark-workflow .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#benchmark-workflow .rough-node .label,#benchmark-workflow .node .label,#benchmark-workflow .image-shape .label,#benchmark-workflow .icon-shape .label{text-align:center;}#benchmark-workflow .node.clickable{cursor:pointer;}#benchmark-workflow .root .anchor path{fill:#333333!important;stroke-width:0;stroke:#333333;}#benchmark-workflow .arrowheadPath{fill:#333333;}#benchmark-workflow .edgePath .path{stroke:#333333;stroke-width:2.0px;}#benchmark-workflow .flowchart-link{stroke:#333333;fill:none;}#benchmark-workflow .edgeLabel{background-color:rgba(232,232,232, 0.8);text-align:center;}#benchmark-workflow .edgeLabel p{background-color:rgba(232,232,232, 0.8);}#benchmark-workflow .edgeLabel rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#benchmark-workflow .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#benchmark-workflow .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#benchmark-workflow .cluster text{fill:#333;}#benchmark-workflow .cluster span{color:#333;}#benchmark-workflow div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Arial;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#benchmark-workflow .flowchartTitleText{text-anchor:middle;font-size:1