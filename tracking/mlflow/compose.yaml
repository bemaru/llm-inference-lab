name: llm-inference-lab-mlflow

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlflow}
      POSTGRES_USER: ${POSTGRES_USER:-mlflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlflow-local-only}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mlflow:
    image: ghcr.io/mlflow/mlflow:v${MLFLOW_VERSION:-3.13.0}
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql+psycopg2://${POSTGRES_USER:-mlflow}:${POSTGRES_PASSWORD:-mlflow-local-only}@postgres:5432/${POSTGRES_DB:-mlflow}
      MLFLOW_ARTIFACTS_DESTINATION: /mlartifacts
      MLFLOW_ALLOWED_HOSTS: ${MLFLOW_ALLOWED_HOSTS:-mlflow:5000,localhost:5000,127.0.0.1:5000,localhost:15000,127.0.0.1:15000}
      PSYCOPG2_BINARY_VERSION: ${PSYCOPG2_BINARY_VERSION:-2.9.12}
    command:
      - /bin/sh
      - -c
      - >-
        python -m pip install --no-cache-dir "psycopg2-binary==$${PSYCOPG2_BINARY_VERSION}" &&
        exec mlflow server
        --backend-store-uri "$${MLFLOW_BACKEND_STORE_URI}"
        --artifacts-destination "$${MLFLOW_ARTIFACTS_DESTINATION}"
        --serve-artifacts
        --host 0.0.0.0
        --port 5000
        --workers 2
        --allowed-hosts "$${MLFLOW_ALLOWED_HOSTS}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:5000/health')
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    ports:
      - 127.0.0.1:${MLFLOW_HOST_PORT:-15000}:5000
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - artifact-data:/mlartifacts

volumes:
  artifact-data:
  postgres-data:
