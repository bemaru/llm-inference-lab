    command:
      - ${QWEN36_NVFP4_MODEL:-nvidia/Qwen3.6-35B-A3B-NVFP4}
      - --served-model-name
      - ${QWEN36_NVFP4_SERVED_MODEL_NAME:-qwen3.6-35b-a3b-nvfp4}
      - --host
      - 0.0.0.0
      - --port
      - ${QWEN36_NVFP4_MTP_PORT:-8000}
      - --tensor-parallel-size
      - "1"
      - --trust-remote-code
      - --kv-cache-dtype
      - fp8
      - --attention-backend
      - flashinfer
      - --moe-backend
      - marlin
      - --gpu-memory-utilization
      - ${QWEN36_NVFP4_GPU_MEMORY_UTILIZATION:-0.40}
      - --max-model-len
      - ${QWEN36_NVFP4_MAX_MODEL_LEN:-32768}
      - --max-num-seqs
      - ${QWEN36_NVFP4_MAX_NUM_SEQS:-2}
      - --max-num-batched-tokens
      - ${QWEN36_NVFP4_MAX_NUM_BATCHED_TOKENS:-8192}
      - --enable-chunked-prefill
      - --async-scheduling
      - --enable-prefix-caching
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3,"moe_backend":"triton"}'
      - --load-format
      - fastsafetensors
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - ${QWEN36_NVFP4_TOOL_CALL_PARSER:-qwen3_xml}
      - --enable-auto-tool-choice
      - --default-chat-template-kwargs
      - '{"enable_thinking":false}'
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os, sys, urllib.request; port=os.getenv('QWEN36_NVFP4_MTP_PORT','8000'); sys.exit(0 if urllib.request.urlopen(f'http://127.0.0.1:{port}/health', timeout=5).status == 200 else 1)"
