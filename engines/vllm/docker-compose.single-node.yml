      timeout: 10s
      retries: 10
      start_period: 900s

  vllm-gemma4-26b-a4b-nvfp4-candidate:
    image: ${GEMMA4_NVFP4_VLLM_IMAGE:-vllm/vllm-openai@sha256:3dbe092ec5b2cef63b6104d33fa75d6ce53a7870962529ada69f78bbbc38e776}
    container_name: ${GEMMA4_NVFP4_CONTAINER_NAME:-vllm-gemma4-26b-a4b-nvfp4-candidate}
    profiles: ["gemma4-nvfp4-candidate"]
    network_mode: host
    ipc: host
    shm_size: 16g
    gpus: all
    ulimits:
      memlock: -1
      stack: 67108864
    volumes:
      - ${HF_CACHE:?set HF_CACHE to the host Hugging Face cache path}:/root/.cache/huggingface:ro
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - GEMMA4_NVFP4_HOST=${GEMMA4_NVFP4_HOST:-127.0.0.1}
      - GEMMA4_NVFP4_PORT=${GEMMA4_NVFP4_PORT:-8000}
    command:
      - ${GEMMA4_NVFP4_MODEL:-nvidia/Gemma-4-26B-A4B-NVFP4}
      - --revision
      - ${GEMMA4_NVFP4_REVISION:-a19cfe00be84568a6867111c9a68c9c44fdcffe6}
      - --served-model-name
      - ${GEMMA4_NVFP4_SERVED_MODEL_NAME:-gemma-4-26b-a4b-nvfp4}
      - --host
      - ${GEMMA4_NVFP4_HOST:-127.0.0.1}
      - --port
      - ${GEMMA4_NVFP4_PORT:-8000}
      - --tensor-parallel-size
      - "1"
      - --trust-remote-code
      - --kv-cache-dtype
      - auto
      - --moe-backend
      - marlin
      - --gpu-memory-utilization
      - ${GEMMA4_NVFP4_GPU_MEMORY_UTILIZATION:-0.40}
      - --max-model-len
      - ${GEMMA4_NVFP4_MAX_MODEL_LEN:-32768}
      - --max-num-seqs
      - ${GEMMA4_NVFP4_MAX_NUM_SEQS:-4}
      - --max-num-batched-tokens
      - ${GEMMA4_NVFP4_MAX_NUM_BATCHED_TOKENS:-8192}
      - --enable-chunked-prefill
      - --enable-prefix-caching
      - --reasoning-parser
      - gemma4
      - --tool-call-parser
      - gemma4
      - --enable-auto-tool-choice
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import os, sys, urllib.request; host=os.getenv('GEMMA4_NVFP4_HOST','127.0.0.1'); port=os.getenv('GEMMA4_NVFP4_PORT','8000'); sys.exit(0 if urllib.request.urlopen(f'http://{host}:{port}/health', timeout=5).status == 200 else 1)"
