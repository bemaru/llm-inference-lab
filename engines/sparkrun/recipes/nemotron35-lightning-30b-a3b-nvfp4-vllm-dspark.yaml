recipe_version: "2"
description: Nemotron 3.5 Lightning 30B-A3B NVFP4 with DSpark n3 on one DGX Spark

model: &target_model nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4
model_revision: &target_revision e8f3c7c4de75ad84fe1bcef95d38eca76214480b
runtime: vllm
runtime_version: "0.27.1"
container: vllm/vllm-openai:v0.27.1-ubuntu2404@sha256:6a278041c910af1a6db0f3555aac30dbdf93d7acb01008656d99007cf7781a3a

min_nodes: 1
max_nodes: 1

executor: docker
executor_config:
  auto_remove: false
  privileged: false
  gpus: all
  ipc: host
  shm_size: 16gb
  network: host
  entrypoint: ""
  labels:
    - org.bemaru.llm-inference-lab.recipe=nemotron35-lightning-30b-a3b-nvfp4-vllm-dspark

defaults:
  target_revision: *target_revision
  draft_model: &draft_model nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4-DSpark
  draft_revision: &draft_revision d10c6ff40d6e69d1f92e407e027de3eafdb77645
  host: 0.0.0.0
  port: 8000
  served_model_name: nemotron-3.5-lightning-30b-a3b-nvfp4
  tensor_parallel: 1
  gpu_memory_utilization: 0.40
  max_model_len: 32768
  max_num_seqs: 2
  max_num_batched_tokens: 8192
  num_speculative_tokens: 3

distribution_config:
  models:
    entries:
      - name: *target_model
        target: [-1]
        revision: *target_revision
      - name: *draft_model
        target: [-1]
        revision: *draft_revision

metadata:
  category: agent
  model_params: 30B
  active_params: 3B
  model_dtype: nvfp4
  kv_dtype: fp8
  quantization: nvfp4
  quantization_format: NVIDIA ModelOpt NVFP4
  hardware: NVIDIA DGX Spark GB10
  provenance:
    target_model: *target_model
    target_revision: *target_revision
    draft_model: *draft_model
    draft_revision: *draft_revision
    image_digest: sha256:6a278041c910af1a6db0f3555aac30dbdf93d7acb01008656d99007cf7781a3a
    benchmark_profile: benchmarks/openai-compatible/profiles/nemotron35-lightning-nvfp4-vllm-dspark.json

command: |
  vllm serve \
    {model} \
    --revision {target_revision} \
    --served-model-name {served_model_name} \
    --host {host} \
    --port {port} \
    --tensor-parallel-size {tensor_parallel} \
    --trust-remote-code \
    --kv-cache-dtype fp8 \
    --moe-backend marlin \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs {max_num_seqs} \
    --max-num-batched-tokens {max_num_batched_tokens} \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --mamba-backend flashinfer \
    --mamba-cache-mode align \
    --speculative-config '{"model":"{draft_model}","revision":"{draft_revision}","num_speculative_tokens":{num_speculative_tokens}}' \
    --reasoning-parser nemotron_v3 \
    --tool-call-parser qwen3_coder \
    --enable-auto-tool-choice

post_exec:
  - >-
    python3 -c "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:{port}/health', timeout=10).status == 200"
  - >-
    python3 -c "import json, urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:{port}/v1/models', timeout=10)); assert any(item.get('id') == '{served_model_name}' for item in data['data'])"
